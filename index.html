<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bandeau Craft Com</title>
<style>
:root{--h:6.5vh;--teal:#3f8f86;}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:"Segoe UI",Roboto,Arial,sans-serif}
body.preview{background:#6b7d8c url() center/cover}
.band{position:fixed;left:0;right:0;bottom:2vh;height:var(--h);display:flex;align-items:stretch;
background:linear-gradient(180deg,rgba(14,16,18,.8),rgba(4,5,6,.85));
border-top:.2vh solid var(--teal);box-shadow:0 -1vh 3vh rgba(0,0,0,.35);
animation:in 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{transform:translateY(130%)}to{transform:none}}
.brand{flex:0 0 auto;display:flex;align-items:center;gap:1.4vh;padding:0 3vh 0 2.4vh;position:relative;z-index:2;
background:linear-gradient(90deg,#0b1312,#0f1f1d);clip-path:polygon(0 0,100% 0,calc(100% - 3vh) 100%,0 100%)}
.brand img{height:78%;filter:drop-shadow(0 0 .6vh rgba(63,143,134,.6))}
.brand .txt{color:#e9f3f1;line-height:1.05;font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:2.1vh}
.brand .txt small{display:block;font-weight:600;color:var(--teal);font-size:1.6vh;letter-spacing:.14em}
.viewport{flex:1;overflow:hidden;position:relative;
-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.track{display:flex;align-items:center;height:100%;width:max-content;animation:scroll 40s linear infinite}
.group{display:flex;align-items:center;height:100%}
.item{height:100%;display:flex;align-items:center;padding:0 3vh}
.item img{height:64%;max-width:13vh;object-fit:contain}
.sep{width:.5vh;height:.5vh;border-radius:50%;background:var(--teal);opacity:.8}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
</style></head>
